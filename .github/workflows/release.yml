name: Publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install development dependencies
        run: npm ci

      - name: Verify tag matches the manifest version
        run: test "$GITHUB_REF_NAME" = "v$(node -p 'require(\"./manifest.json\").version')"

      - name: Validate, audit, package, and inspect
        run: npm run validate && npm run audit && npm run package && npm run package:verify && npm run checksums

      - name: Install Chromium for packaged-extension tests
        run: npx playwright install --with-deps chromium

      - name: Test the exact release package
        run: BAPT_E2E_PACKAGE="$(find dist -name '*.zip' -print -quit)" xvfb-run -a npm run test:e2e

      - name: Generate a CycloneDX dependency inventory
        run: npm sbom --sbom-format cyclonedx > dist/sbom.cdx.json

      - name: Attest the release ZIP provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/*.zip

      - name: Publish immutable GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS dist/sbom.cdx.json --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS dist/sbom.cdx.json --verify-tag --generate-notes --title "Brave Auto Page Translator $GITHUB_REF_NAME"
          fi
