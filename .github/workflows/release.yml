name: Publish release

on:
  push:
    tags:
      - "v*"
    branches:
      - "release/v*"

permissions:
  contents: write
  actions: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install development dependencies
        run: npm ci

      - name: Resolve immutable release identity
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
            RELEASE_MODE="tag"
          elif [[ "$GITHUB_REF_NAME" == release/v* ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME#release/}"
            RELEASE_MODE="branch"
          else
            echo "Unsupported release ref: $GITHUB_REF" >&2
            exit 1
          fi
          test "$RELEASE_TAG" = "v$(node -p 'require(\"./manifest.json\").version')"
          printf 'RELEASE_TAG=%s\nRELEASE_MODE=%s\n' "$RELEASE_TAG" "$RELEASE_MODE" >> "$GITHUB_ENV"

      - name: Validate, audit, package, and inspect
        run: npm run validate && npm run audit && npm run package && npm run package:verify && npm run checksums

      - name: Install Chromium for packaged-extension tests
        run: npx playwright install --with-deps chromium

      - name: Test the exact release package
        run: BAPT_E2E_PACKAGE="$(find dist -name '*.zip' -print -quit)" xvfb-run -a npm run test:e2e

      - name: Generate a CycloneDX dependency inventory
        run: npm sbom --sbom-format cyclonedx > dist/sbom.cdx.json

      - name: Attest the release ZIP provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/*.zip

      - name: Publish immutable GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS dist/sbom.cdx.json --clobber
          elif [[ "$RELEASE_MODE" == "tag" ]]; then
            gh release create "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS dist/sbom.cdx.json --verify-tag --generate-notes --title "Brave Auto Page Translator $RELEASE_TAG"
          else
            gh release create "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS dist/sbom.cdx.json --target "$GITHUB_SHA" --generate-notes --title "Brave Auto Page Translator $RELEASE_TAG"
          fi

      - name: Queue protected staged Chrome Web Store submission
        if: startsWith(github.ref, 'refs/heads/release/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run chrome-web-store.yml --ref main --field release_tag="$RELEASE_TAG" --field publish_type=STAGED_PUBLISH
