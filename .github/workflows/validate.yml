name: Validate extension

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install development dependencies
        run: npm ci

      - name: Validate source and run unit tests
        run: npm run validate

      - name: Install Chromium for extension tests
        run: npx playwright install --with-deps chromium

      - name: Run extension browser tests
        run: xvfb-run -a npm run test:e2e

      - name: Build extension package
        run: npm run package

      - name: Verify ZIP archive
        run: unzip -t dist/*.zip

      - name: Upload extension package
        uses: actions/upload-artifact@v4
        with:
          name: brave-auto-page-translator
          path: dist/*.zip
          if-no-files-found: error

      - name: Upload browser-test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
