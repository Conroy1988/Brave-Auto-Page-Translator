name: Bug report
description: Report a translation, page or extension failure without sharing private content.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not include API keys, passwords, personal data or private webpage text."
  - type: input
    id: version
    attributes:
      label: Extension version
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options: [Automatic, On-device, Google Cloud, LibreTranslate, Google web compatibility]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use a public demonstration page where possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Privacy-safe diagnostic report
      description: Paste only the report exported by the extension settings page.
