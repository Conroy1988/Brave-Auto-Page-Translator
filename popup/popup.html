<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Private Auto Page Translator</title>
    <link rel="stylesheet" href="popup.css">
    <link rel="stylesheet" href="privacy.css">
  </head>
  <body>
    <main class="panel">
      <header class="hero">
        <img src="../icons/icon-48.png" width="42" height="42" alt="">
        <div><p class="eyebrow" data-i18n="independentExtension">INDEPENDENT EXTENSION</p><h1 data-i18n="extensionShortName">Auto Translator</h1></div>
        <label class="switch" aria-label="Enable automatic translation"><input id="enabled" type="checkbox" aria-label="Enable automatic translation"><span></span></label>
      </header>

      <section class="status-card" aria-live="polite">
        <div class="pulse" id="statusPulse" aria-hidden="true"></div>
        <div><p id="statusTitle">Checking this page…</p><span id="statusDetail">Detecting language and website rules</span><small id="providerDetail"></small></div>
      </section>

      <p class="private-notice" id="privateNotice" data-i18n="privateWindowNotice" hidden>Private window: manual translation only. Site and language rules are not saved here.</p>

      <div class="quick-settings">
        <label class="field"><span data-i18n="translatePagesInto">Translate pages into</span><select id="targetLanguage"></select></label>
        <label class="field"><span>Reading mode</span><select id="readingMode"><option value="translated">Translated</option><option value="bilingual">Bilingual</option><option value="hover">Original on hover</option></select></label>
      </div>

      <div class="actions">
        <button class="primary" id="translateNow" type="button" data-i18n="translateThisPage">Translate this page</button>
        <button class="secondary wide" id="openSidePanel" type="button">Open translation workspace</button>
        <div class="quick-grid">
          <button class="secondary" id="automaticSite" type="button" data-i18n="automaticSite">Automatically translate this site</button>
          <button class="secondary" id="siteRule" type="button" data-i18n="neverSite">Never translate this site</button>
          <button class="secondary" id="languageRule" type="button" data-i18n="neverLanguage">Never translate this language</button>
        </div>
      </div>

      <footer><button class="link-button" id="openOptions" type="button" data-i18n="settingsPrivacy">Settings & privacy</button><span id="version"></span></footer>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
